# Simulação do setor de medicamentos e produtos hospitalares (perfil: distribuidora).
[calculadora]
url = "http://localhost:8080/api"
timeout_s = 30
workers = 4
# A simulação para se a calculadora estiver em outra versão (resultados reproduzíveis).
versao_esperada = "1.6.1"

[simulacao]
setor = "saude"
dh_fato_gerador = "2027-01-15T10:00:00-03:00"
informar_tp_doc = true
# Confere na calculadora se cada NCM existe na data simulada (o ncm-aplicavel não confere).
validar_ncm = true
# Em 2027 o ICMS segue integral; PIS/COFINS deixam de existir.
tributos_remanescentes = ["ICMS", "ICMS_ST"]
# Créditos de hoje nas entradas. PIS/COFINS só no lucro real; nos medicamentos monofásicos
# o C170 de entrada já vem com PIS/COFINS zerado, então eles não geram crédito.
creditos_atuais = ["ICMS", "PIS", "COFINS"]

# Valores do exemplo oficial da calculadora: substitua pelo cenário que quer simular.
[simulacao.aliquotas_nominais]
cbs = 8.8
ibs_estadual = 0.05
ibs_municipal = 0.05

# Governança: quem aprovou cada regra. Com exigir_aprovacao = true, item classificado por
# regra sem aprovação vai para revisao.csv com o alerta REGRA_NAO_APROVADA.
[governanca]
aprovacoes = "../exemplos/saude/aprovacoes.csv"
exigir_aprovacao = false

[saude]
cadastro_produtos = "../exemplos/saude/cadastro_produtos.csv"
cadastro_participantes = "../exemplos/saude/participantes.csv"
