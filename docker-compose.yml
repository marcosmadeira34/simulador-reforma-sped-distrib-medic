services:
  calculadora:
    build:
      context: .
      dockerfile: docker/calculadora.Dockerfile
      args:
        # Versão fixa: cada release muda regras e tabelas. Para subir de versão, rode antes
        # os testes de contrato (RTC_URL=... pytest -m contrato) e atualize versao_esperada.
        RTC_REF: "1.6.1"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      retries: 10
