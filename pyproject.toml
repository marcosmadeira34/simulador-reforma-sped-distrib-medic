[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-reforma-sped"
version = "0.2.1"
description = "Simula CBS, IBS e Imposto Seletivo sobre itens de uma EFD ICMS/IPI usando a Calculadora RTC oficial da Receita Federal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcos Vinicius Silva" }]
dependencies = ["requests>=2.31", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
simulador-rtc = "simulador_rtc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
